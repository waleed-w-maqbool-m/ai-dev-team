name: pages

# Builds the replay-only console (no backend, no API key needed) and publishes
# it to GitHub Pages. Live runs only work against a local `python api.py`.
# Manual for now: Pages needs the repository to be public (or a paid plan)
# and "Source: GitHub Actions" selected under Settings > Pages. Once that's
# done, add a `push: branches: [master]` trigger here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
      # GitHub Pages has no SPA fallback: serve the app shell for unknown paths.
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
